name: Verify compatibility libraries
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp -DskipTests install
      - name: Install browser engines for native API checks
        run: mvn -B -ntp -f compat-reuse-smoke/pom.xml org.codehaus.mojo:exec-maven-plugin:3.6.3:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.classpathScope=test -Dexec.args="install --with-deps chromium firefox webkit"
      - run: mvn -B -ntp clean install
      - run: mvn -B -ntp -pl gwt-user-compat-tests -am -Dteavm.junit.js.runner=browser-firefox test
      - run: mvn -B -ntp -Pproduction verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-verification
          path: |
            **/target/surefire-reports/**
            **/target/spotbugs/**
