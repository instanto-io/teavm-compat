name: Verify compatibility libraries
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, instanto-container]
    env:
      # Runner images can carry different browser revisions; use the versions
      # selected by this build in a writable, job-local cache.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'
      # Read and published snapshots live on packages.instanto.io.
      FORGEJO_PACKAGE_USER: ${{ secrets.FORGEJO_PACKAGE_USER }}
      FORGEJO_PACKAGE_TOKEN: ${{ secrets.FORGEJO_PACKAGE_TOKEN }}
    steps:
      - name: Allocate job-local browser cache
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/compat-test-browsers-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # The parents are published to packages.instanto.io. Maven resolves a parent
      # before reading it, so the registry is declared in job-local settings, with
      # its credentials; MAVEN_ARGS applies them to every mvn below.
      - name: Configure Maven for packages.instanto.io
        run: |
          set -euo pipefail
          settings="$RUNNER_TEMP/maven-settings.xml"
          repo='<id>forgejo-instanto</id><url>https://packages.instanto.io/api/packages/instanto-io/maven</url><releases><enabled>false</enabled></releases><snapshots><enabled>true</enabled></snapshots>'
          cat > "$settings" <<XML
          <settings>
            <servers><server><id>forgejo-instanto</id><username>\${env.FORGEJO_PACKAGE_USER}</username><password>\${env.FORGEJO_PACKAGE_TOKEN}</password></server></servers>
            <profiles><profile><id>instanto-snapshots</id>
              <repositories><repository>${repo}</repository></repositories>
              <pluginRepositories><pluginRepository>${repo}</pluginRepository></pluginRepositories>
            </profile></profiles>
            <activeProfiles><activeProfile>instanto-snapshots</activeProfile></activeProfiles>
          </settings>
          XML
          echo "MAVEN_ARGS=--settings $settings" >> "$GITHUB_ENV"
      - run: mvn -U -B -ntp -DskipTests install
      - run: mvn -U -B -ntp clean install
      - run: mvn -U -B -ntp -pl gwt-user-compat-tests -am -Dteavm.junit.js.runner=browser-firefox test
        env:
          # Apply Firefox's automation startup preferences to TeaVM's temporary
          # profile so headless windows deliver native focus and blur events.
          MOZ_MARIONETTE: '1'
      - run: mvn -U -B -ntp -Pproduction verify
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Measure browser execution against Java source maps
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/compat-coverage-browsers
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'
        run: |
          npm ci --prefix scripts/browser-coverage --ignore-scripts
          npm test --prefix scripts/browser-coverage
          scripts/browser-coverage/node_modules/.bin/playwright install chromium
          npm run collect --prefix scripts/browser-coverage -- --exclude-module gwt-user-compat
      - name: Measure GWT runtime branches with Tea-Coco and merge JVM probes
        run: |
          mvn -U -B -ntp -Pbrowser-coverage -pl gwt-user-compat-tests verify
          mvn -B -ntp -pl gwt-user-compat org.jacoco:jacoco-maven-plugin:0.8.15:report \
            -Djacoco.dataFile="$PWD/gwt-user-compat-tests/target/jvm-baseline.exec"
          python3 scripts/check-gwt-coverage.py
      - name: SonarQube Quality Gate
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonar.instanto.io
        run: |
          set -euo pipefail
          : "${SONAR_TOKEN:?SONAR_TOKEN is required for the main-branch quality gate}"
          repo_name="${GITHUB_REPOSITORY#*/}"
          mvn --batch-mode --no-transfer-progress -Pbrowser-coverage sonar:sonar \
            -Dsonar.projectKey="$repo_name" \
            -Dsonar.projectName="$repo_name" \
            -Dsonar.qualitygate.wait=true
      - name: Publish verification reports to packages.instanto.io
        if: always()
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_publish_report.py'
          python3 - <<'PYREPORT'
          from pathlib import Path
          import shutil
          destination = Path('target/compatibility-verification')
          patterns = ['*/target/surefire-reports/*', '*/target/spotbugs/*',
                      'target/browser-coverage.xml', 'gwt-user-compat-tests/target/teavm-coverage.xml*',
                      'gwt-user-compat-tests/target/compiler-evidence.json']
          for pattern in patterns:
              for source in Path('.').glob(pattern):
                  if source.is_file() and not source.is_symlink():
                      output = destination / source
                      output.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(source, output)
          PYREPORT
          python3 .github/scripts/publish_report.py --name compatibility-verification \
            --path target/compatibility-verification
      - name: Remove coverage browser cache
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/compat-coverage-browsers" "$PLAYWRIGHT_BROWSERS_PATH"
