name: Verify compatibility libraries
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, instanto-container]
    env:
      # The runner image ships the browsers read-only at this path. Without this,
      # Playwright tries to install them again and fails writing its lock file.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check out the shared development parent
        uses: actions/checkout@v4
        with:
          repository: instanto-io/instanto-poms
          path: .build/instanto-poms
      - name: Install the shared development parent
        run: mvn -B -ntp -f .build/instanto-poms/pom.xml install
      - run: mvn -B -ntp -DskipTests install
      - run: mvn -B -ntp clean install
      - run: mvn -B -ntp -pl gwt-user-compat-tests -am -Dteavm.junit.js.runner=browser-firefox test
      - run: mvn -B -ntp -Pproduction verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-verification
          path: |
            **/target/surefire-reports/**
            **/target/spotbugs/**
