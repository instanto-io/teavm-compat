name: Publish

# Downstream ports consume this snapshot by Maven coordinate, so every verified
# push to main republishes it to packages.instanto.io.

on:
  workflow_run:
    workflows: [ Verify compatibility libraries ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-snapshot:
    name: Instanto snapshots
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Deploy to packages.instanto.io
      goals: clean deploy
      maven-args: -DskipTests
      timeout-minutes: 30
    secrets: inherit
