name: Publish verified compatibility artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          server-id: github
      - name: Check out the shared development parent
        uses: actions/checkout@v4
        with:
          repository: instanto-io/instanto-poms
          path: .build/instanto-poms
      - name: Install the shared development parent
        run: mvn -B -ntp -f .build/instanto-poms/pom.xml install
      - run: mvn -B -ntp -DskipTests install
      - name: Install browser engines for native API checks
        run: mvn -B -ntp -f compat-reuse-smoke/pom.xml org.codehaus.mojo:exec-maven-plugin:3.6.3:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.classpathScope=test -Dexec.args="install --with-deps chromium firefox webkit"
      - run: mvn -B -ntp -Pproduction clean deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
