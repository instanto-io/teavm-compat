name: Publish

# Publishes the compatibility library snapshots to packages.instanto.io, the
# destination every project inherits from instanto-org-pom.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  snapshots:
    name: packages.instanto.io
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Deploy snapshots to packages.instanto.io
      goals: clean deploy
      fast-deploy: true
      downstream-checks: false
      sonar: false
      timeout-minutes: 30
    secrets: inherit
